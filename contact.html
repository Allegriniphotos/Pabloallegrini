<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact — Pablo Allegrini</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Get in touch with Pablo Allegrini, landscape and nature photographer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-nav" id="siteNav">
  <a class="wordmark" href="index.html">Pablo Allegrini</a>
  <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  <nav class="links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
    <a href="https://www.instagram.com/pp.allegrini/" aria-label="Instagram" target="_blank" rel="noopener">
      <svg class="ig-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.4" cy="6.6" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </nav>
</header>

<div class="page-header">
  <span class="hero-kicker mono">Let's talk</span>
  <h1>Contact</h1>
  <p>For print orders, image licensing, or just to talk photography.</p>
</div>

<section>
  <div class="contact-wrap">
    <div class="contact-card">
      <div class="contact-row">
        <div>
          <div class="contact-label">E-mail</div>
          <div class="contact-value"><a href="mailto:pabloallegrini@gmail.com">pabloallegrini@gmail.com</a></div>
        </div>
        <button class="copy-btn" id="copyEmail" data-email="pabloallegrini@gmail.com">Copy</button>
      </div>
      <div class="contact-row">
        <div>
          <div class="contact-label">Instagram</div>
          <div class="contact-value"><a href="https://www.instagram.com/pp.allegrini/" target="_blank" rel="noopener">@pp.allegrini</a></div>
        </div>
        <a class="copy-btn" href="https://www.instagram.com/pp.allegrini/" target="_blank" rel="noopener" style="text-decoration:none; display:inline-block;">Open</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <span class="mono">© 2026 PABLO ALLEGRINI</span>
  <a href="https://www.instagram.com/pp.allegrini/" target="_blank" rel="noopener">Instagram</a>
</footer>

<script src="script.js"></script>
<script>
  const copyBtn = document.getElementById("copyEmail");
  if (copyBtn) {
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(copyBtn.dataset.email);
        copyBtn.textContent = "Copied ✓";
        copyBtn.classList.add("copied");
        setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("copied"); }, 2000);
      } catch(e) {
        copyBtn.textContent = "Copy manually";
      }
    });
  }
</script>
</body>
</html>
